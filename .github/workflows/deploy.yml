name: Deploy

# Called by CI after tests pass on main. Can also be run by hand.
on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
      SITE_URL: ${{ vars.SITE_URL || (vars.CUSTOM_DOMAIN && format('https://{0}', vars.CUSTOM_DOMAIN)) || '' }}
      CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
    steps:
      - name: Check Cloudflare is configured
        id: gate
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$D1_DATABASE_ID" ] || [ -z "$SITE_URL" ]; then
            echo "::warning title=Deploy skipped::CLOUDFLARE_API_TOKEN is not set. Tests passed but nothing was deployed. See docs/DEPLOY.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.ready == 'true'
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.ready == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: steps.gate.outputs.ready == 'true'
        run: npm ci

      - name: Build the static site
        if: steps.gate.outputs.ready == 'true'
        env:
          NEXT_PUBLIC_SITE_URL: ${{ env.SITE_URL }}
        run: npm run build:web

      - name: Production Worker config
        if: steps.gate.outputs.ready == 'true'
        run: node scripts/prod-config.mjs

      - name: Apply D1 migrations
        if: steps.gate.outputs.ready == 'true'
        working-directory: apps/api
        run: npx wrangler d1 migrations apply interview-tower --remote -c wrangler.production.jsonc

      - name: Deploy the Worker and the static assets
        if: steps.gate.outputs.ready == 'true'
        working-directory: apps/api
        run: |
          set -o pipefail
          npx wrangler deploy -c wrangler.production.jsonc | tee /tmp/deploy.log

      - name: Smoke test the live site
        if: steps.gate.outputs.ready == 'true'
        run: |
          if [ -n "$CUSTOM_DOMAIN" ]; then BASE="https://$CUSTOM_DOMAIN"; else BASE="$SITE_URL"; fi
          echo "Checking $BASE"
          for _ in $(seq 1 10); do curl -sf "$BASE/api/health" && break; sleep 3; done
          curl -sf "$BASE/api/health" | grep -q '"environment":"production"'
          curl -sf "$BASE/" | grep -q "<title>Interview Tower"
          curl -sf "$BASE/api/daily" | grep -q questionId
          echo "### Deployed to $BASE" >> "$GITHUB_STEP_SUMMARY"
